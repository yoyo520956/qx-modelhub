# ============================================================
# ModelHub + Agnes · QX AI 模块 v1.2.4（可单独导入 / 叠加到主配置）
# 仓库: https://github.com/yoyo520956/qx-modelhub
#
# 本模块只含「AI 路由」：ModelHub 面板 + 永不中断网关 + Agnes 预置 + 高速流量。
# 不含去广告、不含代理节点，可与你的主配置叠加导入。
#
# ===== 可复制的网址 =====
#   AI 网关(客户端 Base URL):  https://example.com/v1
#   面板(管理提供商/模型):     https://example.com/mh/
#   自检(确认模块生效):        https://example.com/mh/api/ping
#   Agnes(已内置,免配):        https://api.agnes-ai.cn/v1
#   客户端 API Key: 面板「路由」页生成一个 sk-mh-…（留空=不校验）
#
# v1.2.4 要点：
#   · /v1/ 全部网关代答 —— 上游任何错误自动重试+自动换模型，
#     绝不返回错误码给 App（默认最长重试 10 分钟，面板可调）
#   · 用量统计：每5小时/每日/每周/每月/总共（token+调用次数），
#     聚合永久保留；面板「用量」页 GitHub 风仪表盘
#   · 以后你在面板里手动添加的任何提供商/模型，自动享受同样的
#     重试与统计，无需额外配置
#
# ===== 用法 =====
#   1. 导入本模块（可以和主配置共存）→ 重载隧道
#   2. 开 https://example.com/mh/  确认 Agnes 已预置
#   3. 客户端填  https://example.com/v1  + 那个 Key，发一句测试
#   4. 想加自己的模型/密钥：面板「提供商」页填好点「拉取」勾选加入
# ============================================================

[policy]
# 高速流量：全节点 5 分钟重测延迟，自动选最快（开电信数据时把顶部策略切到这个组）
url-latency-benchmark=高速流量, server-tag-regex=.*, check-interval=300, tolerance=0, alive-checking=false, img-url=bolt.fill

[rewrite_local]
# ModelHub v1.2.4 —— 本地模型路由（面板 + 永不中断网关 + Agnes 预置）
^https?://example\.com/mh url script-echo-response https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub-v124.js
^https?://example\.com/v1/models url script-echo-response https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub-v124.js
^https?://example\.com/v1/ url script-echo-response https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub-v124.js

[task_local]
# ModelHub 探活（间隔要和面板「路由」页的探活间隔一致）
*/10 * * * * https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub-v124.js, tag=ModelHub-Cron, img-url=arrow.triangle.2.circlepath, enabled=true
# 用量报告 ×4（同一脚本，全窗口报告：每5小时/每日/每周/每月/总共）
0 */5 * * * https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub-usage.js, tag=ModelHub用量5小时, img-url=chart.bar.fill, enabled=true
5 0 * * * https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub-usage.js, tag=ModelHub用量日报, img-url=chart.bar.fill, enabled=true
5 8 * * 1 https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub-usage.js, tag=ModelHub用量周报, img-url=chart.line.uptrend.xy1, enabled=true
5 8 1 * * https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub-usage.js, tag=ModelHub用量月报, img-url=chart.line.uptrend.xy1, enabled=true

[mitm]
# 本地应答域名（IANA 保留域，请求根本不会真发出去；需已装 QX 根证书）
hostname = example.com

# ============================================================
