; ============================================================
; ModelHub · Quantumult X 本地 LLM 模型路由
; 生成于 2026-11-22
; 仓库 https://github.com/yoyo520956/qx-modelhub
; ------------------------------------------------------------
; 把这段整体粘进 QX 配置文件，或存成 ModelHub.conf 导入
;
; 装好后打开：http://127.0.0.1:9999/mh/
;
; 【三种取脚本的方式，任选其一】
;  A. GitHub 直连（默认，能自动更新）
;  B. 国内镜像（raw 被墙时用这组，把下面 A 组注释掉）
;  C. 本地文件（最稳，完全离线）
;     把 modelhub.js / modelhub-gw.js / modelhub-cron.js 放进
;     「iCloud Drive → Quantumult X → Scripts」
;     然后把地址换成裸文件名（见文件末尾的注释块）
; ============================================================

[http_backend]
; —— A. GitHub 直连 ——
https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub.js, tag=ModelHub面板, path=^/mh/, enabled=true
https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub-gw.js, tag=ModelHub网关, path=^/v1/, enabled=true

; —— B. 国内镜像（二选一，把上面两行注释掉再启用）——
;https://ghfast.top/https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub.js, tag=ModelHub面板, path=^/mh/, enabled=true
;https://ghfast.top/https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub-gw.js, tag=ModelHub网关, path=^/v1/, enabled=true

[task_local]
*/10 * * * * https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub-cron.js, tag=ModelHub探活, enabled=true
;https://ghfast.top/https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub-cron.js, tag=ModelHub探活, enabled=true

; ============================================================
; 【C. 本地文件版】用这个就把上面所有 https 行注释掉
; ------------------------------------------------------------
;[http_backend]
;modelhub.js, tag=ModelHub面板, path=^/mh/, enabled=true
;modelhub-gw.js, tag=ModelHub网关, path=^/v1/, enabled=true
;
;[task_local]
;*/10 * * * * modelhub-cron.js, tag=ModelHub探活, enabled=true
; ============================================================

; 【首次使用】
; 1. 面板「提供商」→ 点预设 → 填 Key → 保存并拉取模型
; 2. 勾选要用的模型 → 添加
; 3. 点顶部「检测」跑一轮探活
; 4. 面板「路由」→ 生成网关 Key（务必设，否则同 WiFi 的人能白嫖你的额度）
; 5. 客户端 Base URL 填 http://127.0.0.1:9999/v1，Key 填网关 Key
;
; 【注意】上面 */10 的探活间隔要和面板「路由」页里的「探活间隔」一致
; ============================================================
