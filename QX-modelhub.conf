; ============================================================
; ModelHub · Quantumult X 本地 LLM 模型路由   v1.1.1
; 仓库 https://github.com/yoyo520956/qx-modelhub
; ------------------------------------------------------------
; 一个脚本文件 modelhub.js + 一条 [http_backend] 配置。
; 面板和网关都在 /mh 下面，所以只需要一条。
;
;   面板   http://127.0.0.1:9999/mh/
;   网关   http://127.0.0.1:9999/mh/v1
;   自检   http://127.0.0.1:9999/mh/api/ping
;
; 自检返回 {"ok":true,"pong":1,...} 才算装好。
; ============================================================

[http_backend]
https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub.js, tag=ModelHub, path=^/mh/, enabled=true
; raw 拉不动就注释上面一行、启用下面一行：
;https://cdn.jsdelivr.net/gh/yoyo520956/qx-modelhub@main/modelhub.js, tag=ModelHub, path=^/mh/, enabled=true
; 连 9999 都连不上时，启用这条官方样例做对照（打开 /example/v1/ 应显示 We got you.）：
;https://raw.githubusercontent.com/crossutility/Quantumult-X/master/sample-backend.js, tag=QXTest, path=^/example/v1/, enabled=true

[task_local]
*/10 * * * * https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub.js, tag=ModelHub-Cron, enabled=true
;*/10 * * * * https://cdn.jsdelivr.net/gh/yoyo520956/qx-modelhub@main/modelhub.js, tag=ModelHub-Cron, enabled=true

; ============================================================
; 【首次使用】
; 1. 面板「提供商」→ 点预设 → 填 Key → 保存并拉取模型
; 2. 勾选模型 → 添加 → 点顶部「检测」
; 3. 「路由」页生成网关 Key（务必设，否则同 WiFi 能白嫖你的额度）
; 4. 客户端 Base URL 填 http://127.0.0.1:9999/mh/v1，Key 填网关 Key
;
; 【本地文件版（不联网，最稳）】
;   把 modelhub.js 放进「iCloud Drive → Quantumult X → Scripts」，然后：
;   [http_backend]
;   modelhub.js, tag=ModelHub, path=^/mh/, enabled=true
;   [task_local]
;   */10 * * * * modelhub.js, tag=ModelHub-Cron, enabled=true
; ============================================================
