; ============================================================
; ModelHub v1.2.0 · Quantumult X 本地 LLM 模型路由
; 仓库 https://github.com/yoyo520956/qx-modelhub
; ------------------------------------------------------------
; 架构：全部走 rewrite，**不需要 9999 端口 / http_backend**
;
;   面板   https://example.com/mh/
;   网关   https://example.com/v1
;   自检   https://example.com/mh/api/ping
;
; 为什么是 example.com：它是 IANA 保留的文档域名，全球可解析、
; 有 A 记录，QX 在 MITM 阶段就能拦下来本地应答，请求根本不会
; 真的发出去。这样不用改 DNS、不用碰 9999，最省事。
;
; 需要：① 本文件三段配置  ② 脚本放本地或让它走 GitHub
;      ③ QX 的根证书已安装并信任（去广告用过 MITM 的话就已经有了）
; ============================================================

[rewrite_local]
^https?://example\.com/mh url script-echo-response https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub.js
^https?://example\.com/v1/models url script-echo-response https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub.js
^https?://example\.com/v1/ url script-request-header https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub.js

[task_local]
*/10 * * * * https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub.js, tag=ModelHub-Cron, enabled=true

[mitm]
hostname = example.com

; ============================================================
; 【本地文件版（不联网，最稳）】
; 把 modelhub.js 放进「iCloud Drive → Quantumult X → Scripts」，
; 三条 rewrite 和 task 里的 URL 全部换成裸文件名 modelhub.js。
;
; 【首次使用】
; 1. 重载隧道 → 打开 https://example.com/mh/api/ping
;    出 {"ok":true,"pong":1,"v":"1.2.0"} 就是通了
; 2. 面板「提供商」→ 选预设 → 填 Key → 保存并拉取模型
; 3. 勾选模型 → 添加 → 点顶部「检测」
; 4. 客户端 Base URL 填 https://example.com/v1
;
; 【注意】
; · 入口域名想换的话，三处一起改：rewrite 三条 + mitm hostname
; · 只有 OpenAI 兼容通道参与流式路由；Anthropic / Gemini 可以
;   在面板里管理、探活，但不会进客户端模型列表（因为响应格式
;   不同，request-header 阶段没法在本地转换）
; ============================================================
