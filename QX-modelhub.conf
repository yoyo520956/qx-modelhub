; ============================================================
; ModelHub · Quantumult X 本地 LLM 模型路由   v1.1.0
; 仓库 https://github.com/yoyo520956/qx-modelhub
; ------------------------------------------------------------
; 只需要一个脚本文件 modelhub.js，和下面两行配置。
;
; 装完打开：  http://127.0.0.1:9999/mh/
; 自检地址：  http://127.0.0.1:9999/mh/api/ping
;   → 返回 {"ok":true,"pong":1,...} 说明脚本已加载
;   → 返回 404 / 打不开 = 脚本没加载，看下面「换源」
; ============================================================

[http_backend]
; —— A. GitHub 直连 ——
https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub.js, tag=ModelHub, path=^/(mh|v1), enabled=true

; —— B. jsDelivr（A 拉不动时换这个，把 A 注释掉）——
;https://cdn.jsdelivr.net/gh/yoyo520956/qx-modelhub@main/modelhub.js, tag=ModelHub, path=^/(mh|v1), enabled=true

; —— C. 本地文件（最稳，完全不联网）——
;把 modelhub.js 放进「iCloud Drive → Quantumult X → Scripts」，然后用这一行：
;modelhub.js, tag=ModelHub, path=^/(mh|v1), enabled=true

[task_local]
*/10 * * * * https://raw.githubusercontent.com/yoyo520956/qx-modelhub/main/modelhub.js, tag=ModelHub-Cron, enabled=true
;*/10 * * * * https://cdn.jsdelivr.net/gh/yoyo520956/qx-modelhub@main/modelhub.js, tag=ModelHub-Cron, enabled=true
;*/10 * * * * modelhub.js, tag=ModelHub-Cron, enabled=true

; ============================================================
; 如果 path 里的正则 (mh|v1) 不被识别，拆成两条：
;   modelhub.js, tag=ModelHub-Panel, path=^/mh, enabled=true
;   modelhub.js, tag=ModelHub-GW,    path=^/v1, enabled=true
;
; 【首次使用】
; 1. 面板「提供商」→ 点预设 → 填 Key → 保存并拉取模型
; 2. 勾选模型 → 添加 → 点顶部「检测」
; 3. 「路由」页生成网关 Key（务必设，否则同 WiFi 能白嫖你的额度）
; 4. 客户端 Base URL 填 http://127.0.0.1:9999/v1，Key 填网关 Key
; ============================================================
